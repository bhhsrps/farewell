<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浸信會孔憲紹天虹小學「弦誦竹園南」 - 互動時光留言牆與大螢幕互動系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            background-color: #0F172A;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1E293B;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        /* Danmaku styling */
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            will-change: transform;
            pointer-events: none;
            animation: fly linear forwards;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 50;
        }
        @keyframes fly {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        /* Glowing AI effect */
        .ai-glow {
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.4);
            border: 1px solid rgba(20, 184, 166, 0.6);
        }
        /* Radial background for stage */
        .bg-radial-dots {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        /* Polaroid Animation */
        .polaroid-card {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8) rotate(-5deg);
        }
        .polaroid-exit {
            animation: popOut 0.5s ease-in forwards !important;
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1) rotate(var(--rot)); }
        }
        @keyframes popOut {
            to { opacity: 0; transform: scale(0.8) translateY(-50px) rotate(calc(var(--rot) + 10deg)); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 針對「三合一工作台」內嵌模擬器進行極精細比例縮放，徹底避免任何重疊或溢出 */
        #stage-embed-target #stage-left-panel {
            padding: 0.5rem !important;
            gap: 0.25rem !important;
            border-radius: 0.75rem !important;
        }
        #stage-embed-target #stage-left-panel > span {
            font-size: 0.75rem !important; /* 縮小「📲 掃碼發送留言/相片」 */
            margin-bottom: 0.125rem !important;
        }
        #stage-embed-target #stage-qrcode-container {
            width: 6rem !important; /* 縮小二維碼至 96px */
            height: 6rem !important;
            padding: 0.25rem !important;
            margin: 0 auto !important;
            border-radius: 0.5rem !important;
        }
        #stage-embed-target #stage-qrcode-img {
            width: 100% !important;
            height: 100% !important;
        }
        #stage-embed-target #stage-url-indicator {
            display: none !important; /* 模擬器內隱藏超長本機/GitHub網址，避免擠壓空間 */
        }
        #stage-embed-target #stage-left-panel p {
            font-size: 8px !important;
            line-height: 1.1 !important;
            margin-top: 0.125rem !important;
        }
        /* 縮小模擬器頂部 Header 與校徽，避免文字擠壓 */
        #stage-embed-target h2 {
            font-size: 1rem !important; /* text-base */
            line-height: 1.2 !important;
        }
        #stage-embed-target p {
            font-size: 0.65rem !important; /* text-[10px] */
            line-height: 1.2 !important;
        }
        #stage-embed-target .md\:w-16 {
            width: 2.25rem !important;
            height: 2.25rem !important;
            padding: 0.125rem !important;
        }
        /* 縮小時間與雲端同步標籤 */
        #stage-embed-target #stage-live-time {
            font-size: 0.875rem !important;
            line-height: 1 !important;
        }
        #stage-embed-target .text-\[10px\] {
            font-size: 8px !important;
        }
        #stage-embed-target .backdrop-blur-md {
            padding: 0.35rem !important;
            border-radius: 0.5rem !important;
        }
        /* 微調模擬器下方的跑馬燈 */
        #stage-embed-target .bg-slate-950\/90 {
            padding: 0.35rem 0.75rem !important;
            border-radius: 0.5rem !important;
        }
        #stage-embed-target .bg-slate-950\/90 span {
            font-size: 0.65rem !important;
            padding: 0.125rem 0.25rem !important;
        }
        #stage-embed-target #stage-ticker-text {
            font-size: 0.75rem !important;
            height: auto !important;
        }
        /* 縮小相片牆中的相機圖示 placeholder */
        #stage-embed-target #stage-placeholder .text-5xl {
            font-size: 1.75rem !important;
        }
        #stage-embed-target #stage-placeholder h3 {
            font-size: 0.875rem !important;
            margin-top: 0.25rem !important;
        }
        #stage-embed-target #stage-placeholder p {
            font-size: 0.65rem !important;
            margin-top: 0.125rem !important;
        }
        /* 縮小 AI 詩歌大螢幕投影在模擬器內的大小 */
        #stage-embed-target #stage-display-poem {
            padding: 0.75rem !important;
        }
        #stage-embed-target #stage-display-poem span {
            font-size: 0.75rem !important;
        }
        #stage-embed-target #stage-poem-content {
            font-size: 0.85rem !important;
            line-height: 1.3 !important;
            margin: 0.25rem 0 !important;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

    <div id="toast-container" class="fixed top-4 right-4 z-[9999] space-y-2 pointer-events-none"></div>

    <!-- View Router / Fullscreen Manager -->
    <div id="app-container" class="w-full h-screen flex flex-col overflow-hidden">
        
        <header id="dashboard-header" class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4 z-10 hidden">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full p-0.5 border border-slate-700 shadow-md shrink-0 flex items-center justify-center overflow-hidden">
                    <img src="https://www.chsc.hk/psp2025/pic/logo_431.jpg" alt="校徽" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-lg font-black text-orange-400 tracking-wide">浸信會孔憲紹天虹小學「弦誦竹園南」竹園校舍惜別活動</h1>
                    <p class="text-xs text-slate-400">舊校舍惜別日 · 大螢幕互動與留言牆雲端系統</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.switchView('dashboard')" id="btn-view-dashboard" class="px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-500 font-semibold text-xs flex items-center gap-2 transition text-slate-950">
                    <i class="fa-solid fa-desktop"></i> 三合一工作台
                </button>
                <button onclick="window.switchView('stage')" id="btn-view-stage" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-expand"></i> 全螢幕大舞台
                </button>
                <button onclick="window.switchView('mobile')" id="btn-view-mobile" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold text-xs flex items-center gap-2 transition">
                    <i class="fa-solid fa-mobile-screen-button"></i> 全螢幕手機端
                </button>
            </div>
        </header>

        <div id="view-dashboard" class="flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-y-auto hidden">
            
            <div class="lg:col-span-7 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold text-slate-400 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-ping"></span>
                        大禮堂投影大螢幕模擬器 (即時彈幕與相片輪播牆)
                    </span>
                    <button onclick="window.openStageWindow()" class="text-xs text-orange-400 hover:underline flex items-center gap-1 hidden">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> 在獨立新窗口開啟
                    </button>
                </div>
                
                <div id="stage-emulator-frame" class="w-full aspect-video bg-gradient-to-b from-slate-950 to-blue-950 rounded-2xl border-4 border-slate-700 shadow-2xl relative overflow-hidden flex flex-col justify-between">
                    <div id="stage-embed-target" class="w-full h-full relative"></div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col gap-6">

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col gap-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <h3 class="font-bold text-orange-400 flex items-center gap-2">
                            <i class="fa-solid fa-mobile-retro"></i> 手機來賓發送端 (模擬器)
                        </h3>
                        <span class="text-xs bg-blue-900/50 text-blue-300 px-2.5 py-1 rounded-full border border-blue-800">
                            實時連線
                        </span>
                    </div>
                    <div id="mobile-embed-target" class="bg-slate-950 border border-slate-800 rounded-xl h-[460px] overflow-y-auto"></div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col gap-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <h3 class="font-bold text-teal-400 flex items-center gap-2">
                            <i class="fa-solid fa-gears"></i> 後台留言審核中心
                        </h3>
                    </div>
                    <div id="control-embed-target"></div>
                </div>
            </div>

        </div>

        <div id="view-stage" class="hidden flex-grow w-full bg-gradient-to-b from-slate-950 to-blue-950 relative overflow-hidden">
        </div>

        <div id="view-mobile" class="hidden flex-grow w-full bg-slate-950 p-4 flex justify-center items-center overflow-y-auto">
            <div class="w-full max-w-md bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl h-full flex flex-col">
                <div id="mobile-fullscreen-target" class="flex-grow overflow-y-auto h-full"></div>
            </div>
        </div>

    </div>

    <!-- ================== TEMPLATES ================== -->

    <template id="tmpl-mobile">
        <div class="p-4 space-y-4 text-slate-200">
            <div class="text-center border-b border-slate-800 pb-3">
                <div class="w-16 h-16 mx-auto bg-white rounded-full p-1 border border-slate-700 shadow-md mb-2 flex items-center justify-center overflow-hidden">
                    <img src="https://www.chsc.hk/psp2025/pic/logo_431.jpg" alt="校徽" class="w-full h-full object-contain">
                </div>
                <h4 class="font-bold text-slate-100 text-base mt-1">「弦誦竹園南」留言板</h4>
                <p class="text-xs text-slate-400">寫下您的祝福、上傳舊照共建時光牆</p>
            </div>
            
            <form id="submission-form" onsubmit="window.handleFormSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">您的名字/暱稱 *</label>
                        <input type="text" id="mob-name" required placeholder="如：陳小明老師" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">您的身份 *</label>
                        <select id="mob-identity" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                            <option value="校友">校友</option>
                            <option value="前教職員">前教職員</option>
                            <option value="前校長">前校長</option>
                            <option value="學生">在校學生</option>
                            <option value="家長">家長</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">快捷心意貼紙（點擊快速填寫）</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="window.insertSticker(this, '回憶滿載，珍重再見！感謝天虹！')" class="sticker-btn text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-1 rounded text-slate-300 transition">🌸 珍重再見</button>
                        <button type="button" onclick="window.insertSticker(this, '竹園不老，我們終會在新校園重逢。')" class="sticker-btn text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-1 rounded text-slate-300 transition">💫 期盼重逢</button>
                        <button type="button" onclick="window.insertSticker(this, '感謝恩師，教導之恩終生難忘。')" class="sticker-btn text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-1 rounded text-slate-300 transition">🎓 感謝恩師</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">感言與祝福 (100字內) *</label>
                    <textarea id="mob-message" required rows="3" placeholder="寫點什麼，表達您的祝福..." maxlength="100" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-orange-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">分享照片 (選填)</label>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div class="relative border-2 border-dashed border-slate-700 bg-slate-950/50 rounded-lg p-2 hover:border-orange-500 transition cursor-pointer flex flex-col items-center justify-center text-center h-16">
                            <input type="file" id="mob-file-input" accept="image/*" onchange="window.previewUserPhoto(event)" class="absolute inset-0 opacity-0 cursor-pointer">
                            <span class="text-lg">📷</span>
                            <span class="text-[10px] text-slate-400">上傳相片 (最大5MB)</span>
                        </div>
                        <div class="border border-slate-800 bg-slate-950 rounded-lg p-1.5 grid grid-cols-3 gap-1">
                            <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=150&h=150&q=80" onclick="window.usePresetPhoto(this, 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&h=800&q=80')" class="w-full h-12 object-cover rounded cursor-pointer hover:border-2 hover:border-orange-500 transition" alt="Preset 1">
                            <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=150&h=150&q=80" onclick="window.usePresetPhoto(this, 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=800&h=800&q=80')" class="w-full h-12 object-cover rounded cursor-pointer hover:border-2 hover:border-orange-500 transition" alt="Preset 2">
                            <img src="https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?auto=format&fit=crop&w=150&h=150&q=80" onclick="window.usePresetPhoto(this, 'https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?auto=format&fit=crop&w=800&h=800&q=80')" class="w-full h-12 object-cover rounded cursor-pointer hover:border-2 hover:border-orange-500 transition" alt="Preset 3">
                        </div>
                    </div>
                    <div id="mob-photo-preview-box" class="hidden flex justify-between items-center bg-slate-850 p-2 rounded-lg border border-slate-700">
                        <div class="flex items-center gap-2">
                            <img id="mob-photo-preview-img" src="" class="w-10 h-10 object-cover rounded border border-slate-600" alt="Preview">
                            <span class="text-[11px] text-slate-400 truncate max-w-[150px]">已選定相片</span>
                        </div>
                        <button type="button" onclick="window.clearSelectedPhoto(this)" class="text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i> 移除</button>
                    </div>
                </div>

                <button type="submit" id="btn-submit-message" class="w-full bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-slate-950 font-black py-2.5 rounded-lg text-sm transition shadow-lg transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> 投放至現場大螢幕
                </button>
            </form>
        </div>
    </template>

    <template id="tmpl-control">
        <div class="space-y-4">
            <div class="flex border-b border-slate-800 text-xs">
                <button onclick="window.switchControlTab('pending')" id="tab-btn-pending" class="flex-1 py-2 font-bold text-teal-400 border-b-2 border-teal-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-hourglass-half"></i> 待審核 (<span id="cnt-pending">0</span>)
                </button>
                <button onclick="window.switchControlTab('approved')" id="tab-btn-approved" class="flex-1 py-2 font-bold text-slate-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-circle-check"></i> 已發布 (<span id="cnt-approved">0</span>)
                </button>
                <button onclick="window.switchControlTab('gemini')" id="tab-btn-gemini" class="flex-1 py-2 font-bold text-slate-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> AI 生成詩篇
                </button>
            </div>

            <div id="panel-tab-pending" class="space-y-3">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-semibold">待處理列表</span>
                    <button onclick="window.approveAll()" class="text-teal-400 hover:underline font-semibold">一鍵批准全部</button>
                </div>
                <div id="audit-list" class="space-y-2 max-h-[260px] overflow-y-auto pr-1">
                    </div>
            </div>

            <!-- Approved Tab: Added a highly visible, premium green Export Button on the right -->
            <div id="panel-tab-approved" class="hidden space-y-3">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-semibold">已在大螢幕上顯示</span>
                    <div class="flex gap-3">
                        <button onclick="window.exportToCSV()" class="text-emerald-400 hover:text-emerald-300 font-bold flex items-center gap-1 transition">
                            <i class="fa-solid fa-file-excel"></i> 一鍵匯出資料
                        </button>
                        <button onclick="window.triggerClearAllConfirm()" class="text-red-400 hover:text-red-300 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 清空全部數據
                        </button>
                    </div>
                </div>
                <div id="approved-list" class="space-y-2 max-h-[260px] overflow-y-auto pr-1">
                    </div>
            </div>

            <div id="panel-tab-gemini" class="hidden space-y-4">
                <div class="bg-slate-950 p-4 rounded-xl border border-teal-900/50 space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-xs font-black text-teal-400 flex items-center gap-1">
                            <i class="fa-solid fa-feather-pointed"></i> 📜 彙整天虹溫馨回憶
                        </h4>
                        <span class="text-[10px] bg-teal-950 text-teal-300 px-2 py-0.5 rounded-full border border-teal-800">Gemini Engine</span>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed">
                        Gemini 將會讀取目前已通過審核的祝福語，深度創作出一首專屬本次感恩大會的三段式現代押韻詩歌，您可將其投影至現場大螢幕！
                    </p>
                    <button onclick="window.triggerGeminiPoemGeneration()" class="w-full py-2 bg-gradient-to-r from-teal-600 to-emerald-500 hover:from-teal-500 hover:to-emerald-400 text-slate-950 font-black text-xs rounded-lg transition shadow flex items-center justify-center gap-2">
                        <span id="gemini-poem-spin" class="hidden"><i class="fa-solid fa-spinner animate-spin"></i></span>
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 締造集體回憶惜別詩篇
                    </button>
                </div>

                <div id="gemini-poem-output-box" class="hidden bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-xs font-bold text-slate-300 flex items-center gap-1">
                            <i class="fa-solid fa-scroll text-amber-500"></i> AI 創作大會詩篇
                        </span>
                        <div class="flex gap-2">
                            <button onclick="window.toggleProjectPoem()" id="btn-project-poem" class="text-[10px] bg-blue-900 hover:bg-blue-800 text-blue-200 px-2 py-0.5 rounded transition">
                                <i class="fa-solid fa-desktop"></i> 投影至大螢幕
                            </button>
                        </div>
                    </div>
                    <div id="gemini-poem-text" class="text-xs font-serif leading-relaxed text-amber-100/90 whitespace-pre-line text-center py-2 max-h-[160px] overflow-y-auto italic font-[Noto Serif TC]">
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Template for Stage Screen -->
    <template id="tmpl-stage">
        <div class="w-full h-full relative overflow-hidden flex flex-col justify-between p-6 select-none bg-radial-dots">
            
            <canvas id="stage-bg-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

        window.generateFullAvatar = (name) => {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createLinearGradient(0, 0, 300, 300);
            grad.addColorStop(0, '#0D8B41');
            grad.addColorStop(1, '#055c29');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 300, 300);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(150, 150, 110, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let cleanName = name.trim();
            let fontSize = 36;
            
            if (cleanName.length > 8) {
                fontSize = 20;
            } else if (cleanName.length > 5) {
                fontSize = 26;
            }
            
            ctx.font = `bold ${fontSize}px "Noto Sans TC", sans-serif`;
            
            if (cleanName.length > 4) {
                const mid = Math.ceil(cleanName.length / 2);
                const line1 = cleanName.substring(0, mid);
                const line2 = cleanName.substring(mid);
                ctx.fillText(line1, 150, 120);
                ctx.fillText(line2, 150, 180);
            } else {
                ctx.fillText(cleanName, 150, 150);
            }
            
            return canvas.toDataURL('image/png');
        };

        // 💡 一鍵匯出 CSV 功能（含 UTF-8 BOM 防 Excel 亂碼）
        window.exportToCSV = () => {
            const msgs = window.appState.messages;
            if (!msgs || msgs.length === 0) {
                window.showToast("目前沒有留言數據可供匯出！", "error");
                return;
            }

            // UTF-8 BOM 檔頭，防止 Excel 讀取繁體中文時產生亂碼
            let csvContent = "\ufeff"; 
            
            // 標題列
            csvContent += "發送時間,來賓姓名,身份標籤,祝福留言內容,審核狀態,是否有照片\n";

            // 寫入各欄位資料（加入雙引號防止逗號破壞 CSV 結構）
            msgs.forEach(m => {
                const timeStr = new Date(m.timestamp).toLocaleString('zh-HK');
                const name = `"${(m.name || '').replace(/"/g, '""')}"`;
                const identity = `"${(m.identity || '').replace(/"/g, '""')}"`;
                const message = `"${(m.message || '').replace(/"/g, '""')}"`;
                const status = m.approved ? "已發布" : "待審核";
                const hasPhoto = m.photo ? "是" : "否";

                csvContent += `${timeStr},${name},${identity},${message},${status},${hasPhoto}\n`;
            });

            // 建立下載點
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            // 下載命名格式：弦誦竹園南_留言數據_2026-07-11.csv
            const dateStr = new Date().toISOString().slice(0, 10);

            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            window.showToast("📊 留言數據已成功匯出為 Excel CSV 檔！", "success");
        };

        async function setupFirebase() {
            if (isFirebaseInitialized) return;
            isFirebaseInitialized = true;

            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (authError) {
                            console.warn("Firebase Custom Token auth failed, falling back to Anonymous auth:", authError);
                            try {
                                await signInAnonymously(auth);
                            } catch (anonymousError) {
                                console.error("Firebase Anonymous auth also failed:", anonymousError);
                                throw anonymousError;
                            }
                        }
                    };
                    await initAuth();

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            startRealtimeSync();
                        } else {
                            fallbackToLocalMode();
                        }
                    });
                } catch (e) {
                    console.error("Firebase setup error (falling back to local mode):", e);
                    window.showToast("雲端資料庫驗證失敗，已切換至本地離線模式。請至 Firebase 控制台啟用「匿名」登入方法。", "error");
                    fallbackToLocalMode();
                }
            } else {
                console.warn("No Firebase config found. Running in local dummy mode.");
                fallbackToLocalMode();
            }
        }

        function startRealtimeSync() {
            if (!currentUser || !db) return;
            
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            
            if (unsubscribeMessages) unsubscribeMessages();
            
            unsubscribeMessages = onSnapshot(messagesRef, (snapshot) => {
                const msgs = [];

        // ================== MOBILE SENDER LOGIC ==================

        window.previewUserPhoto = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            window.showToast("正在處理解析相片中...", "info");

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxWidth = 1200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    
                    window.appState.selectedPhotoBase64 = compressedStringSizeCheck(compressedBase64) ? compressedBase64 : null;
                    
                    if (window.appState.selectedPhotoBase64) {
                        showPhotoPreview(event.target, compressedBase64);
                        window.showToast("相片壓縮完成，可正常投放！", "success");
                    } else {
                        window.showToast("相片檔案過大，請選擇其他相片", "error");
                        event.target.value = "";
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        function compressedStringSizeCheck(base64Str) {
            const sizeInBytes = base64Str.length * 0.75;
            return sizeInBytes < 850000; 
        }

        window.usePresetPhoto = (el, url) => {
            fetch(url)

            const isActive = btn.classList.contains('bg-orange-600');

                let currentVal = textarea.value;

        function initStageCanvas(canvas) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            
            function resize() {
                const parent = canvas.parentElement;
                width = canvas.width = parent.clientWidth;
                height = canvas.height = parent.clientHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = [];
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'white';
                particles.forEach(p => {
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.vx;
                    p.y += p.vy;
                    if(p.x < 0) p.x = width;
                    if(p.x > width) p.x = 0;
                    if(p.y < 0) p.y = height;
                    if(p.y > height) p.y = 0;
                });
                canvasAnimFrame = requestAnimationFrame(draw);
            }
            draw();
        }

        function triggerCompanionDanmakus(currentId) {

                if (el.dataset.id) activeIds.add(el.dataset.id);
            });

            const candidates = approved.filter(m => m.id !== currentId && !activeIds.has(m.id));
            
            if (candidates.length === 0) return;

            const numToPick = Math.min(candidates.length, 2);
            const shuffled = candidates.sort(() => 0.5 - Math.random());
            const picked = shuffled.slice(0, numToPick);

            picked.forEach(m => {
                setTimeout(() => {
                    launchDanmaku(m);

            });

        // 💡 智慧防撞/防重疊彈幕發射器
        function launchDanmaku(msg) {
            let danmakuContainers = [];
            if(window.appState.currentView === 'dashboard') {
                const embed = document.getElementById('stage-embed-target');
                if(embed) danmakuContainers.push(embed.querySelector('#danmaku-container'));
            } else if (window.appState.currentView === 'stage') {
                const stage = document.getElementById('view-stage');
                if(stage) danmakuContainers.push(stage.querySelector('#danmaku-container'));
            }

            danmakuContainers.forEach(container => {
                if(!container) return;
                
                // 初始化軌道冷卻時間戳陣列 (共 8 條水平軌道)
                if (!window.appState.danmakuLanes) {
                    window.appState.danmakuLanes = new Array(8).fill(0);
                }
                
                const now = Date.now();
                const numLanes = 8;
                let selectedLane = 0;
                
                // 1. 篩選出目前完全沒有彈幕在起點冷卻期內的「空閒軌道」
                const freeLanes = [];
                for (let i = 0; i < numLanes; i++) {
                    if (now > window.appState.danmakuLanes[i]) {
                        freeLanes.push(i);
                    }
                }
                
                if (freeLanes.length > 0) {
                    // 2. 有空閒軌道，隨機挑選一條
                    selectedLane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
                } else {
                    // 3. 全滿時，智慧挑選「最快會解鎖」的那一條軌道，避免疊加碰撞
                    let minTime = Infinity;
                    for (let i = 0; i < numLanes; i++) {
                        if (window.appState.danmakuLanes[i] < minTime) {
                            minTime = window.appState.danmakuLanes[i];
                            selectedLane = i;
                        }
                    }
                }
                
                // 4. 計算新彈幕的長度，動態給予軌道專屬的「起點清空冷卻期」（字數越多，完全飄入畫面所需時間越長）
                const baseCooldown = 3500; // 最低間隔 3.5 秒
                const charFactor = Math.min(5500, msg.message.length * 120); // 隨字數累加的避讓時間
                window.appState.danmakuLanes[selectedLane] = now + baseCooldown + charFactor;
                
                // 5. 將軌道編號精準換算為 Y 軸百分比 (避開頂部 5% 與底部 15%，中間均勻鋪開)
                const laneHeightPct = 5 + (selectedLane * 11);
                
                const el = document.createElement('div');
                el.className = 'danmaku-item text-2xl md:text-4xl';
                el.dataset.id = msg.id; 
                const colors = ['text-orange-300', 'text-teal-300', 'text-amber-200', 'text-rose-300', 'text-blue-300'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                el.classList.add(color);
                el.innerHTML = `<span class="bg-slate-900/75 px-4 py-2 rounded-full border border-slate-700 backdrop-blur-sm shadow-xl">
                                    <span class="font-extrabold text-base md:text-lg text-slate-300 mr-3 border-r border-slate-700 pr-3">${msg.name}</span>
                                    ${msg.message}
                                </span>`;
                
                el.style.top = `${laneHeightPct}%`;
                
                const duration = Math.max(8, msg.message.length * 0.4) + (Math.random() * 3);
                el.style.animationDuration = `${duration}s`;

                container.appendChild(el);
                
                el.addEventListener('animationend', () => el.remove());
            });
        }

        window.triggerGeminiPoemGeneration = async () => {

                window.showToast("需要至少一則通過審核的留言，才能讓 AI 寫詩喔！", "error");

            }

            const spin = document.getElementById('gemini-poem-spin');
            if(spin) spin.classList.remove('hidden');

            const contentBlock = approvedMsgs.map(m => `- ${m.name}(${m.identity}): ${m.message}`).join('\n');
            const prompt = `你是一位充滿溫情詩人。請根據以下來自「浸信會孔憲紹天虹小學竹園南校舍」惜別活動中，老師、校友和學生們的留言，創作一首感人的「現代押韻詩歌」。
要求：
1. 詩歌必須是精鍊的「三段式」，每段四句。
2. 情感真摯，包含對舊校園(竹園南村)的不捨，以及對未來新校園的祝福。
3. 詞藻優美，帶有校園回憶的意象（如：紅磚、下課鐘聲、雨天操場、同窗等）。
4. 結尾必須充滿希望。
5. 只輸出詩歌文本，不需 any extra explanation or title.

來賓留言內容：
${contentBlock}`;

            const maxRetries = 5;
            const baseDelay = 1000;
            
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (!response.ok) throw new Error("HTTP error! status: " + response.status);
                    
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        window.appState.generatedPoem = text;
                        document.getElementById('gemini-poem-text').innerText = text;
                        document.getElementById('gemini-poem-output-box').classList.remove('hidden');

                        throw new Error("No text in response");
                    }
                } catch (error) {
                    if (i === maxRetries - 1) {
                        console.error("Gemini API Error after retries:", error);
                        window.appState.generatedPoem = "竹園青翠歲月長，\n紅磚映照舊時光。\n同窗嬉戲鐘聲伴，\n恩師教誨入心房。\n\n風雨四十情未減，\n走廊依稀笑語還。\n一磚一瓦皆故事，\n回首依依淚闌珊。\n\n弦歌不輟新天虹，\n初心如一展雄風。\n珍重再見非訣別，\n明日重逢暖意融。";
                        document.getElementById('gemini-poem-text').innerText = window.appState.generatedPoem;
                        document.getElementById('gemini-poem-output-box').classList.remove('hidden');
                        window.showToast("已載入 AI 備用詩篇", "info");
                    } else {
                        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i)));
                    }
                }
            }
            if(spin) spin.classList.add('hidden');
        };

        window.toggleProjectPoem = () => {
            window.appState.projectPoemActive = !window.appState.projectPoemActive;
            const btn = document.getElementById('btn-project-poem');
            if (btn) {
                if(window.appState.projectPoemActive) {
                    btn.classList.replace('bg-blue-900', 'bg-rose-700');
                    btn.classList.replace('hover:bg-blue-800', 'hover:bg-rose-600');
                    btn.innerHTML = '<i class="fa-solid fa-desktop text-white"></i> 停止投影';
                } else {
                    btn.classList.replace('bg-rose-700', 'bg-blue-900');
                    btn.classList.replace('hover:bg-rose-600', 'hover:bg-blue-800');
                    btn.innerHTML = '<i class="fa-solid fa-desktop"></i> 投影至大螢幕';
                }
            }
            updateStagePoemOverlay();
        };

        function updateStagePoemOverlay(targetContainer = null) {
            const containers = targetContainer ? [targetContainer] : [];
            if (!targetContainer) {
                if(window.appState.currentView === 'dashboard') {
                    const embed = document.getElementById('stage-embed-target');
                    if(embed) containers.push(embed);
                } else if (window.appState.currentView === 'stage') {
                    const stage = document.getElementById('view-stage');
                    if(stage) containers.push(stage);
                }
            }

            containers.forEach(container => {
                const memLayer = container.querySelector('#stage-display-memories');
                const poemLayer = container.querySelector('#stage-display-poem');
                const poemContent = container.querySelector('#stage-poem-content');

                if (window.appState.projectPoemActive && window.appState.generatedPoem) {
                    if (memLayer) memLayer.classList.add('hidden');
                    if (poemLayer) {
                        poemLayer.classList.remove('hidden');
                        poemLayer.classList.add('ai-glow');
                    }
                    if (poemContent) poemContent.innerText = window.appState.generatedPoem;
                } else {
                    if (memLayer) memLayer.classList.remove('hidden');
                    if (poemLayer) container.querySelector('#stage-display-poem').classList.add('hidden');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
        window.addEventListener('hashchange', initApp);
        
    </script>
</body>
</html>
